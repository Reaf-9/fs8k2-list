<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ふたりの やりたいことリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EE;
    --ink:#2E3148;
    --ink-soft:#6A6D85;
    --leaf:#5E8C56;        /* マサヒロ＝葉 */
    --leaf-bg:#EAF2E6;
    --oto:#C9647F;         /* 静音＝音 */
    --oto-bg:#F9E9EE;
    --spark:#E8A34C;       /* 線香花火の火花 */
    --spark-deep:#D4842B;
    --done-bg:#FFF7E8;
    --line:#E4DCCC;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Zen Maru Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:72px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{padding:44px 0 8px;text-align:center}
  .eyebrow{
    font-size:13px;letter-spacing:.35em;color:var(--ink-soft);
    margin-bottom:10px;
  }
  h1{
    font-family:"Kaisei Decol",serif;
    font-size:clamp(26px,7vw,34px);
    font-weight:700;letter-spacing:.06em;
  }
  h1 .ha{color:var(--leaf)}
  h1 .oto{color:var(--oto)}
  .subnote{font-size:12px;color:var(--ink-soft);margin-top:6px}

  /* ---------- 線香花火プログレスバー ---------- */
  .senko{margin:30px 0 8px;position:relative;height:56px}
  .senko .wire{
    position:absolute;top:28px;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--ink) var(--pct,5%),var(--line) var(--pct,5%));
    border-radius:2px;
  }
  .senko .tama{
    position:absolute;top:28px;left:var(--pct,5%);
    width:14px;height:14px;margin:-6px 0 0 -7px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#FFD98A,var(--spark) 55%,var(--spark-deep));
    box-shadow:0 0 14px 5px rgba(232,163,76,.55);
    transition:left 1.2s cubic-bezier(.22,1,.36,1);
  }
  .senko .tama::before,.senko .tama::after{
    content:"";position:absolute;left:50%;top:50%;width:2px;height:16px;
    background:linear-gradient(180deg,rgba(255,217,138,.9),transparent);
    transform-origin:top center;
  }
  .senko .tama::before{transform:translate(-50%,-2px) rotate(35deg)}
  .senko .tama::after{transform:translate(-50%,-2px) rotate(-140deg)}
  @media (prefers-reduced-motion: no-preference){
    .senko .tama{animation:flicker 2.6s ease-in-out infinite}
    @keyframes flicker{
      0%,100%{box-shadow:0 0 14px 5px rgba(232,163,76,.55)}
      50%{box-shadow:0 0 20px 8px rgba(232,163,76,.75)}
    }
  }
  .progress-label{
    text-align:center;font-family:"Kaisei Decol",serif;
    font-size:19px;letter-spacing:.05em;
  }
  .progress-label b{font-size:30px;color:var(--spark-deep);padding:0 2px}
  .progress-sub{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:2px}

  /* ---------- filter chips ---------- */
  .chips{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    margin:26px 0 22px;
  }
  .chip{
    font-family:inherit;font-size:13.5px;font-weight:500;
    padding:7px 15px;border-radius:99px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink-soft);cursor:pointer;
    transition:all .15s ease;
  }
  .chip[aria-pressed="true"]{
    background:var(--ink);border-color:var(--ink);color:#fff;
  }
  .chip:focus-visible{outline:3px solid var(--spark);outline-offset:2px}

  /* ---------- list ---------- */
  ul.list{list-style:none;display:flex;flex-direction:column;gap:12px}
  .card{
    background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;position:relative;
  }
  .card.done{
    background:var(--done-bg);border-color:#EDD9AF;
  }
  .card-top{display:flex;align-items:flex-start;gap:10px}
  .badge{
    flex:none;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    padding:3px 10px;border-radius:99px;margin-top:3px;
  }
  .badge.masa{background:var(--leaf-bg);color:var(--leaf)}
  .badge.shizu{background:var(--oto-bg);color:var(--oto)}
  .badge.both{background:#F3ECD9;color:var(--spark-deep)}
  .title{font-size:16.5px;font-weight:700;letter-spacing:.02em;flex:1}
  .card.done .title{color:#8A6A2E}
  .memo{font-size:13px;color:var(--ink-soft);margin-top:6px;padding-left:2px}

  .kanaeta{
    margin-top:10px;padding-top:10px;border-top:1.5px dashed #E3CFA0;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .stamp{
    font-family:"Kaisei Decol",serif;font-size:14px;font-weight:700;
    color:var(--spark-deep);letter-spacing:.1em;
    display:inline-flex;align-items:center;gap:5px;
  }
  .stamp::before{content:"🎆";font-size:15px}
  .date{font-size:12.5px;color:var(--ink-soft)}
  .omoide{font-size:13.5px;color:#7A6234;width:100%}

  .empty{
    text-align:center;color:var(--ink-soft);font-size:14px;
    padding:40px 0;
  }

  /* ---------- states ---------- */
  #loading,#error{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:14px}
  #error{display:none}
  #error button{
    margin-top:14px;font-family:inherit;font-size:14px;font-weight:700;
    padding:10px 26px;border-radius:99px;border:none;cursor:pointer;
    background:var(--ink);color:#fff;
  }
  .dots::after{content:"…";animation:dots 1.4s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @media (prefers-reduced-motion: reduce){.dots::after{animation:none;content:"…"}}

  footer{
    margin-top:44px;text-align:center;font-size:11.5px;color:#A8A390;
    line-height:1.9;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">MASAHIRO ✕ SHIZUNE</p>
      <h1>ふたりの<br>やりたいこと<span class="ha">リ</span><span class="oto">ス</span>ト</h1>
      <p class="subnote">叶えたら 🎆 が増えていくページ</p>
    </header>

    <div id="loading" class="dots">リストをひらいています</div>

    <div id="error">
      <p>リストを読み込めませんでした。<br>電波のいいところで、もう一度ひらいてみてください。</p>
      <button onclick="location.reload()">もう一度ひらく</button>
    </div>

    <div id="app" style="display:none">
      <div class="senko" aria-hidden="true">
        <div class="wire"></div>
        <div class="tama"></div>
      </div>
      <p class="progress-label">やりたいこと <b id="pct">0</b>% 達成</p>
      <p class="progress-sub" id="count"></p>

      <div class="chips" role="group" aria-label="表示の切り替え">
        <button class="chip" data-f="all" aria-pressed="true">すべて</button>
        <button class="chip" data-f="masa" aria-pressed="false">マサヒロ発</button>
        <button class="chip" data-f="shizu" aria-pressed="false">静音発</button>
        <button class="chip" data-f="done" aria-pressed="false">叶えた 🎆</button>
      </div>

      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" style="display:none">まだここには何もないみたい。ふたりで増やしていこ。</p>
    </div>

    <footer>
      このページはマサヒロが更新すると自動で新しくなります<br>
      <span id="updated"></span>
    </footer>
  </div>

<script>
(function(){
  var SHEET_ID = "1sIH7D7bxw-dD81d5gyd5oRrm5R3Fl7IghISxpwSxUnk";
  var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&t=";

  // 列の並び（シート側と合わせる）: A✓ / B言い出しっぺ / C一緒にやりたいこと / Dメモ / E叶えた日 / F思い出メモ
  var COL = {check:0, person:1, item:2, memo:3, date:4, omoide:5};

  function parseCSV(text){
    var rows=[],row=[],cur="",inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else {inQ=false;} }
        else cur+=c;
      }else{
        if(c==='"') inQ=true;
        else if(c===','){row.push(cur);cur="";}
        else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
        else if(c!=='\r') cur+=c;
      }
    }
    if(cur!==""||row.length){row.push(cur);rows.push(row);}
    return rows;
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }

  function personClass(p){
    if(p.indexOf("マサヒロ")>-1) return "masa";
    if(p.indexOf("静音")>-1) return "shizu";
    return "both";
  }
  function personLabel(p,cls){
    if(cls==="both") return p ? p : "ふたり";
    return p;
  }

  var items=[], filter="all";

  function render(){
    var list=document.getElementById("list");
    var shown=items.filter(function(it){
      if(filter==="all") return true;
      if(filter==="done") return it.done;
      return it.cls===filter;
    });
    list.innerHTML = shown.map(function(it){
      var h='<li class="card'+(it.done?' done':'')+'">';
      h+='<div class="card-top">';
      h+='<span class="badge '+it.cls+'">'+esc(personLabel(it.person,it.cls))+'</span>';
      h+='<span class="title">'+esc(it.item)+'</span>';
      h+='</div>';
      if(it.memo) h+='<p class="memo">'+esc(it.memo)+'</p>';
      if(it.done){
        h+='<div class="kanaeta"><span class="stamp">叶えた！</span>';
        if(it.date) h+='<span class="date">'+esc(it.date)+'</span>';
        if(it.omoide) h+='<span class="omoide">'+esc(it.omoide)+'</span>';
        h+='</div>';
      }
      h+='</li>';
      return h;
    }).join("");
    document.getElementById("empty").style.display = shown.length ? "none" : "block";
  }

  function boot(rows){
    // ヘッダー行（「言い出しっぺ」を含む行）を探し、その下をデータとして読む
    var start=0;
    for(var i=0;i<rows.length;i++){
      if(rows[i].join("").indexOf("言い出しっぺ")>-1){start=i+1;break;}
    }
    items=[];
    for(var r=start;r<rows.length;r++){
      var row=rows[r];
      var item=(row[COL.item]||"").trim();
      if(!item || item.indexOf("#REF")>-1) continue;
      var person=(row[COL.person]||"").trim();
      var cls=personClass(person);
      items.push({
        done:(row[COL.check]||"").trim().toUpperCase()==="TRUE",
        person:person, cls:cls, item:item,
        memo:(row[COL.memo]||"").replace(/#REF!/g,"").trim(),
        date:(row[COL.date]||"").trim(),
        omoide:(row[COL.omoide]||"").trim()
      });
    }
    var total=items.length;
    var done=items.filter(function(i){return i.done}).length;
    var pct= total ? Math.round(done/total*100) : 0;

    document.getElementById("pct").textContent=pct;
    document.getElementById("count").textContent= total ? "（"+done+" / "+total+"）" : "";
    document.querySelector(".senko").style.setProperty("--pct", Math.max(pct,2)+"%");
    document.getElementById("updated").textContent =
      "最終読み込み：" + new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

    render();
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="block";
  }

  document.querySelectorAll(".chip").forEach(function(btn){
    btn.addEventListener("click",function(){
      filter=btn.dataset.f;
      document.querySelectorAll(".chip").forEach(function(b){
        b.setAttribute("aria-pressed", b===btn ? "true":"false");
      });
      render();
    });
  });

  fetch(CSV_URL + Date.now())
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.text(); })
    .then(function(text){ boot(parseCSV(text)); })
    .catch(function(){
      document.getElementById("loading").style.display="none";
      document.getElementById("error").style.display="block";
    });
})();
</script>
</body>
</html>
